<div class="w-full max-w-6xl mx-auto space-y-2">
  
  <!-- Información General -->
  <div 
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('general')"
    (mouseleave)="onMouseLeave()">
    
    <div 
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'general'"
      [class.bg-white]="activeSection() !== 'general'">
      
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6" [class.text-blue-600]="activeSection() === 'general'" [class.text-gray-500]="activeSection() !== 'general'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <h3 
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'general'"
          [class.text-gray-800]="activeSection() !== 'general'">
          Información General
        </h3>
      </div>
      
      <svg 
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'general'"
        [class.text-blue-600]="activeSection() === 'general'"
        [class.text-gray-400]="activeSection() !== 'general'"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>

    <div 
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'general' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'general' ? '1' : '0'">
      
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <!-- Aquí va el formulario de información general -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ingrese nombre completo">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
            <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="correo@ejemplo.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="0000-0000">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Información Laboral -->
  <div 
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('laboral')"
    (mouseleave)="onMouseLeave()">
    
    <div 
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'laboral'"
      [class.bg-white]="activeSection() !== 'laboral'">
      
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6" [class.text-blue-600]="activeSection() === 'laboral'" [class.text-gray-500]="activeSection() !== 'laboral'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <h3 
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'laboral'"
          [class.text-gray-800]="activeSection() !== 'laboral'">
          Información Laboral
        </h3>
      </div>
      
      <svg 
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'laboral'"
        [class.text-blue-600]="activeSection() === 'laboral'"
        [class.text-gray-400]="activeSection() !== 'laboral'"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>

    <div 
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'laboral' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'laboral' ? '1' : '0'">
      
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <!-- Aquí va el formulario de información laboral -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Nombre de la empresa">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Puesto</label>
            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Cargo actual">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de ingreso</label>
            <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Salario</label>
            <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="0.00">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Información Educativa -->
  <div 
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('educativa')"
    (mouseleave)="onMouseLeave()">
    
    <div 
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'educativa'"
      [class.bg-white]="activeSection() !== 'educativa'">
      
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6" [class.text-blue-600]="activeSection() === 'educativa'" [class.text-gray-500]="activeSection() !== 'educativa'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        <h3 
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'educativa'"
          [class.text-gray-800]="activeSection() !== 'educativa'">
          Información Educativa
        </h3>
      </div>
      
      <svg 
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'educativa'"
        [class.text-blue-600]="activeSection() === 'educativa'"
        [class.text-gray-400]="activeSection() !== 'educativa'"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>

    <div 
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'educativa' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'educativa' ? '1' : '0'">
      
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <!-- Aquí va el formulario de información educativa -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nivel educativo</label>
            <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="">Seleccione...</option>
              <option>Secundaria</option>
              <option>Técnico</option>
              <option>Universitario</option>
              <option>Postgrado</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Institución</label>
            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Nombre de la institución">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Carrera/Título</label>
            <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Carrera o título obtenido">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Año de graduación</label>
            <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="2020">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Direcciones -->
  <div 
    class="border border-gray-300 rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-300"
    (mouseenter)="onMouseEnter('direcciones')"
    (mouseleave)="onMouseLeave()">
    
    <div 
      class="px-6 py-4 cursor-pointer flex items-center justify-between transition-colors duration-200"
      [class.bg-blue-50]="activeSection() === 'direcciones'"
      [class.bg-white]="activeSection() !== 'direcciones'">
      
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6" [class.text-blue-600]="activeSection() === 'direcciones'" [class.text-gray-500]="activeSection() !== 'direcciones'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <h3 
          class="text-lg font-semibold transition-colors duration-200"
          [class.text-blue-700]="activeSection() === 'direcciones'"
          [class.text-gray-800]="activeSection() !== 'direcciones'">
          Direcciones
        </h3>
      </div>
      
      <svg 
        class="w-5 h-5 transition-transform duration-300 ease-in-out"
        [class.rotate-180]="activeSection() === 'direcciones'"
        [class.text-blue-600]="activeSection() === 'direcciones'"
        [class.text-gray-400]="activeSection() !== 'direcciones'"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>

    <div 
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [style.max-height]="activeSection() === 'direcciones' ? '1000px' : '0px'"
      [style.opacity]="activeSection() === 'direcciones' ? '1' : '0'">
      
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
        <!-- Aquí va el formulario de direcciones -->
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dirección principal</label>
            <textarea rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Calle, número, colonia..."></textarea>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad</label>
              <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ciudad">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Estado/Provincia</label>
              <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Estado">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Código postal</label>
              <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="00000">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
