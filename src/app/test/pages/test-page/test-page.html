<div class="container mx-auto p-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Información del Cliente</h1>
  <app-hover-accordion></app-hover-accordion>
  
  <div class="mt-8 space-y-3">
    <h3 class="text-lg font-semibold text-gray-700 mb-4">Ejemplo de Radio Buttons</h3>
    
    <div class="flex items-center ps-4 border border-gray-300 bg-white rounded-lg hover:bg-gray-50 transition-colors">
      <input id="bordered-radio-1" type="radio" value="option1" name="bordered-radio" 
        class="w-5 h-5 text-blue-600 bg-white border-gray-300 focus:ring-2 focus:ring-blue-500 cursor-pointer">
      <label for="bordered-radio-1" class="w-full py-3 cursor-pointer select-none ms-3 text-sm font-medium text-gray-700">
        Opción por defecto
      </label>
    </div>
    
    <div class="flex items-center ps-4 border border-gray-300 bg-white rounded-lg hover:bg-gray-50 transition-colors">
      <input checked id="bordered-radio-2" type="radio" value="option2" name="bordered-radio" 
        class="w-5 h-5 text-blue-600 bg-white border-gray-300 focus:ring-2 focus:ring-blue-500 cursor-pointer">
      <label for="bordered-radio-2" class="w-full py-3 cursor-pointer select-none ms-3 text-sm font-medium text-gray-700">
        Opción seleccionada
      </label>
    </div>
    
    <div class="flex items-center ps-4 border border-gray-300 bg-white rounded-lg hover:bg-gray-50 transition-colors">
      <input id="bordered-radio-3" type="radio" value="option3" name="bordered-radio" 
        class="w-5 h-5 text-blue-600 bg-white border-gray-300 focus:ring-2 focus:ring-blue-500 cursor-pointer">
      <label for="bordered-radio-3" class="w-full py-3 cursor-pointer select-none ms-3 text-sm font-medium text-gray-700">
        Otra opción
      </label>
    </div>
  </div>
</div>
