<form [formGroup]="form()" (ngSubmit)="onSubmit()" class="space-y-6">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
    <input type="text" formControlName="nombre" class="input-control" />
    @if (form().get('nombre')?.touched && form().get('nombre')?.invalid) {
      <div class="text-red-600 text-xs mt-1">Requerido (mín 2)</div>
    }
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
    <select formControlName="tipo" class="input-control">
      @for (t of tipos; track t) {
        <option [value]="t">{{ t }}</option>
      }
    </select>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="flex items-center">
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          formControlName="flotante"
          class="sr-only peer"
        />
        <div
          class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-400 rounded-full peer dark:bg-gray-700 peer-checked:bg-blue-600 transition-colors"
        ></div>
        <div
          class="absolute top-1/2 left-0.5 -translate-y-1/2 w-5 h-5 bg-white rounded-full shadow-md transition-transform peer-checked:translate-x-5"
        ></div>
        <span class="ml-3 text-sm font-medium text-gray-700">Es monto flotante</span>
      </label>
    </div>

    <div class="flex items-center">
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          formControlName="remediacion"
          class="sr-only peer"
        />
        <div
          class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-400 rounded-full peer dark:bg-gray-700 peer-checked:bg-blue-600 transition-colors"
        ></div>
        <div
          class="absolute top-1/2 left-0.5 -translate-y-1/2 w-5 h-5 bg-white rounded-full shadow-md transition-transform peer-checked:translate-x-5"
        ></div>
        <span class="ml-3 text-sm font-medium text-gray-700">Descripción obligatoria</span>
      </label>
    </div>
  </div>

  <div class="flex justify-end space-x-3 pt-2">
    <button type="button" (click)="onCancel()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">Cancelar</button>
    <button type="submit" [disabled]="form().invalid" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50">{{ btnText }}</button>
  </div>
</form>
